name: Run Sentiment Pipeline

on:
  schedule:
    - cron: '0 0 * * *'  # Otomatis jalan setiap jam 12 malam UTC
  workflow_dispatch:      # Tombol manual untuk menjalankan kapan saja

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Run Script (Apify + Gemini)
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python main.py

      - name: Save & Push Data Back to GitHub
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data_sentimen.json README.md
          git commit -m "Update otomatis data sentimen abu vulkanik Anak Krakatau" || exit 0
          git push
